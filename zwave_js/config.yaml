version: 1.11.0
slug: zwave_js
name: Z-Wave JS
description: Control a Z-Wave network with Home Assistant Z-Wave JS
url: https://github.com/home-assistant/app-zwave-js
arch:
- amd64
- aarch64
discovery:
- zwave_js
hassio_api: true
homeassistant: 2025.12.0
image: ghcr.io/home-assistant/app-zwave-js
init: false
ingress: true
ingress_port: 8091
ingress_stream: true
panel_icon: mdi:z-wave
panel_title: Z-Wave
map:
- app_config:rw
options:
  log_level: info
  log_to_file: false
  log_max_files: 7
  rf_region: Automatic
  soft_reset: Automatic
  s0_legacy_key: ''
  s2_access_control_key: ''
  s2_authenticated_key: ''
  s2_unauthenticated_key: ''
  lr_s2_access_control_key: ''
  lr_s2_authenticated_key: ''
ports:
  3000/tcp: null
  8091/tcp: null
schema:
  device: device(subsystem=tty)?
  socket: str?
  log_level: list(silly|debug|verbose|http|info|warn|error)?
  log_to_file: bool?
  log_max_files: int(1,)?
  rf_region: list(Automatic|Australia/New Zealand|China|Europe|Europe (Long Range)|Hong
    Kong|India|Israel|Japan|Korea|Russia|USA|USA (Long Range))?
  soft_reset: list(Automatic|Enabled|Disabled)?
  s0_legacy_key: match(|[0-9a-fA-F]{32,32})?
  s2_access_control_key: match(|[0-9a-fA-F]{32,32})?
  s2_authenticated_key: match(|[0-9a-fA-F]{32,32})?
  s2_unauthenticated_key: match(|[0-9a-fA-F]{32,32})?
  lr_s2_access_control_key: match(|[0-9a-fA-F]{32,32})?
  lr_s2_authenticated_key: match(|[0-9a-fA-F]{32,32})?
  network_key: match(|[0-9a-fA-F]{32,32})?
  disable_controller_recovery: bool?
  disable_watchdog: bool?
  safe_mode: bool?
startup: services
timeout: 30
