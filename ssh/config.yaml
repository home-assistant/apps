version: 10.6.0
slug: ssh
name: Terminal & SSH
description: Allow logging in remotely to Home Assistant using SSH
url: https://github.com/home-assistant/app-ssh
arch:
- aarch64
- amd64
audio: true
hassio_api: true
hassio_role: manager
host_dbus: true
image: ghcr.io/home-assistant/app-ssh
ingress: true
init: false
map:
- local_apps:rw
- all_app_configs:rw
- backup:rw
- homeassistant_config:rw
- media:rw
- share:rw
- ssl:rw
options:
  authorized_keys: []
  password: ''
  apks: []
  server:
    tcp_forwarding: false
panel_icon: mdi:console
panel_title: Terminal
ports:
  22/tcp: null
schema:
  authorized_keys:
  - str
  password: password
  apks:
  - str
  server:
    tcp_forwarding: bool
startup: services
uart: true
