version: 9.1.1
slug: git_pull
name: Git pull
description: Simple git pull to update the local configuration
url: https://github.com/home-assistant/app-git-pull
arch:
- aarch64
- amd64
boot: manual
hassio_api: true
hassio_role: homeassistant
image: ghcr.io/home-assistant/app-git-pull
init: false
map:
- config:rw
options:
  repository: null
  git_branch: master
  git_remote: origin
  auto_restart: false
  restart_ignore:
  - ui-lovelace.yaml
  - .gitignore
  git_command: pull
  git_prune: false
  deployment_key: []
  deployment_user: ''
  deployment_password: ''
  deployment_key_protocol: rsa
  repeat:
    active: false
    interval: 300
schema:
  repository: str
  git_branch: str
  git_remote: str
  auto_restart: bool
  restart_ignore:
  - str
  git_command: list(pull|reset)
  git_prune: bool
  deployment_key:
  - password
  deployment_user: str
  deployment_password: password
  deployment_key_protocol: match(rsa|ecdsa|ed25519)
  repeat:
    active: bool
    interval: int
startup: services
