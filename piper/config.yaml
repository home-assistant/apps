---
version: 2.5.3
slug: piper
name: Piper
description: Text-to-speech with Piper
url: https://github.com/home-assistant/addons/blob/master/piper
arch:
  - amd64
  - aarch64
init: false
discovery:
  - wyoming
# Voice models ("*.onnx") used to be excluded wholesale, back when /data held
# nothing but re-downloadable copies of catalog voices. The web interface now
# uploads and deletes voices there, so which models are present is the user's
# own choice and has to survive a backup -- an uploaded voice exists nowhere
# else. Only what can be fetched again is skipped.
backup_exclude:
  # OmniVoice weights, 632 MB. The 1.5 MB graph beside them is kept, but the
  # backend needs both files, so a restore without the weights just downloads
  # them again.
  - "*.onnx.data"
  # HuggingFace cache (HF_HOME is /data, so models land in /data/hub).
  - "*/hub"
  # Wheel cache for the optional packs, rebuilt on demand.
  - "*/uv-cache"
  # Voice models that came from the catalog, moved here at startup by
  # sort_catalog_voices.py precisely so they can be excluded. A model is only
  # put here when its md5 matches the catalog's, which makes it a copy of a
  # file that is still published; uploads stay in /data and stay in backups.
  - "*/catalog_voices"
map:
  - share
ingress: true
ingress_port: 8099
panel_icon: mdi:account-voice
panel_title: Piper voices
options:
  backend: piper
  voice: en_US-lessac-medium
  speaker: 0
  length_scale: 1.0
  noise_scale: 0.667
  noise_w: 0.333
  sentence_silence: 0.0
  omnivoice_steps: 32
  enable_japanese: false
  enable_thai: false
  debug_logging: false
  update_voices: true
schema:
