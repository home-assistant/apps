---
# yamllint disable rule:comments rule:line-length rule:truthy
name: Repository updater

on:
  repository_dispatch:
    types: ["update"]

permissions:
  contents: read

jobs:
  update:
    uses: home-assistant/workflows/.github/workflows/repository-updater.yaml@060f22808cea73e58d750001adae1fd02077ec78 # v0.1.2
    secrets:
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
