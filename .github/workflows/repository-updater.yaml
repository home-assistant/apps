---
# yamllint disable rule:comments rule:line-length rule:truthy
name: Repository updater

on:
  repository_dispatch:
    types: ["update"]

permissions:
  contents: read

jobs:
  update:
    uses: home-assistant/workflows/.github/workflows/repository-updater.yaml@43290e4d60baf0ff53555e1766aa0d4ec5cb3a89 # v0.1.1
    secrets:
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
