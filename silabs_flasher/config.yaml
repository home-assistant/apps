version: 1.0.0
slug: silabs_flasher
name: Silicon Labs Flasher
description: Silicon Labs firmware flasher app
url: https://github.com/home-assistant/app-silabs-flasher
arch:
- aarch64
- amd64
gpio: true
hassio_api: true
image: ghcr.io/home-assistant/app-silabs-flasher
init: false
options:
  device: null
  firmware_url: null
  verbose: false
schema:
  device: device(subsystem=tty)?
  firmware_url: url?
  profile: list(yellow|zbt1|zbt2|ihost|slzb07|rts_dtr)?
  probe_methods: str?
  bootloader_reset: str?
  verbose: bool?
stage: experimental
startup: once
boot: manual
