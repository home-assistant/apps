---
configuration:
  username:
    name: Username
    description: >-
      The username you would like to use to authenticate with the Samba server.
  password:
    name: Password
    description: >-
      The password that goes with the username configured for authentication.
  workgroup:
    name: Workgroup
    description: Change WORKGROUP to reflect your network needs.
  enabled_shares:
    name: >-
      Enabled Shares - allowed values are:
      local_apps, app_configs, backup, config, media, share, or ssl.
    description: >-
      List of file shares to make available.
      Adding a share requires typing its name to add it.
      The legacy names addons and addon_configs are still accepted and map to
      local_apps and app_configs for backward compatibility.
      Only these values are allowed;
      the configuration cannot be saved if any other value is in the list.
  compatibility_mode:
    name: Enable Compatibility Mode
    description: >-
      Enable this to use old legacy Samba protocols on the Samba app.
  apple_compatibility_mode:
    name: Enable Compatibility Settings for Apple Devices
    description: >-
      Enable Samba configurations to improve interoperability with Apple
      devices. May cause issues with file systems that do not support xattr
      such as exFAT.
  netbios:
    name: Enable NetBIOS over IP
    description: >-
      Enable NetBIOS over IP for legacy SMB clients (Windows 95/98/ME, Windows
      NT, Windows 2000, Windows XP and LanManager clients). Disable to improve
      security and performance if you do not have legacy SMB clients.
  local_master:
    name: Local master
    description: >-
      When NetBIOS is enabled, try and become a local master browser on a
      subnet.
  network_discovery:
    name: Enable network discovery
    description: >-
      Advertise the host with DNS-SD/mDNS and WS-Discovery. Disable if you
      connect by hostname or IP address and do not want the host to announce
      itself on the network. Shares stay reachable either way.
  server_signing:
    name: Server signing
    description: >-
      Configure SMB server message signing requirements.
      Refer to the smb.conf man page for more information.
      Only change this if you know your SMB clients can support it.
  veto_files:
    name: Veto Files
    description: List of files that are neither visible nor accessible.
  allow_hosts:
    name: Allowed Hosts
    description: List of hosts/networks allowed to access the shared folders.
